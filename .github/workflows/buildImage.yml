name: Build Pib image on RaspianOS
on:
  push:
    branches:
      - develop # Trigger for the develop branch
      - master  # Trigger for the master branch
      - 'release/*'  # Trigger for branches containing 'release' in the name
      - 'feature/*'  # Trigger for branches containing 'feature' in the name
    tags:
      - 'v*.*.*'     # Trigger for version tags (e.g., v1.0.0)
  schedule:
    - cron: '0 0 * * 0'  # Trigger every Sunday at midnight UTC
      branches:
        - main    # Specify the branch for the weekly build
    - cron: '30 23 * * *'   # Trigger every day at 23:30 UTC
      branches:
        - develop # Specify the branch for the daily build

jobs:
  build_docker:
    runs-on: ubuntu-latest
    steps:
      #- name: Clones the pib-backend repository into the path 'pib-backend'.
      #  uses: actions/checkout@v4
      #  with:
      #    repository: 'pib-rocks/pib-backend'
      #    path: app/pib-backend

      #- name: Clones the pib-frontend repository into the path 'cerebra'.
      #  uses: actions/checkout@v4
      #  with:
      #    repository: 'pib-rocks/cerebra'
      #    path: app/cerebra
      
      #- name: Set up Docker Buildx
      #  uses: docker/setup-buildx-action@v3

      #- name: Set up QEMU
      #  uses: docker/setup-qemu-action@v3
      #  with:
      #    platforms: arm64

      - name: Get Docker images
        run: |
          mkdir pib-backend-docker
          cd pib-backend-docker
          wget https://raw.githubusercontent.com/snfeld/pib-backend/6f3886fea81c4f82dae94968378429e1ff50e471/docker-compose.yaml
          sed -i '/image: .*/a\    platform: linux/arm64' docker-compose.yaml
          sed -i '19d' docker-compose.yaml
          touch password.env
          docker compose --profile all pull
          docker image ls | grep pibrocks
          
      #- name: Save Docker images as artifacts
      #  run: |
      #    docker save -o pib-blockly-server.tar pib-blockly-server
      #    docker save -o flask_api.tar flask_api
      #    docker save -o tinkerforge-brickd.tar tinkerforge-brickd
      #    docker save -o ros-camera.tar ros-camera
      #    docker save -o ros_motors.tar ros_motors
      #    docker save -o ros_voice_assistant.tar ros_voice_assistant
      #    docker save -o ros_programs.tar ros_programs
      #    docker save -o ros-display.tar ros-display

      #- name: Upload Docker images as artifacts
      #  uses: actions/upload-artifact@v4
      #  with:
      #    name: docker-images
      #    path: |
      #      pib-blockly-server.tar
      #      flask_api.tar
      #      tinkerforge-brickd.tar
      #      ros-camera.tar
      #      ros_motors.tar
      #      ros_voice_assistant.tar
      #      ros_programs.tar
      #      ros-display.tar

  build:
    runs-on: ubuntu-latest
    needs: build_docker
    steps:

      - name: Checkout the specified branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.schedule && github.event.schedule.branches[0] || github.ref }}

      - name: Updates the package directory and installs necessary dependencies.
        run: |
          sudo apt-get update
          sudo apt-get install --yes coreutils p7zip-full qemu-user-static pv time python3-git python3-yaml jq

      - name: Clones the CustomPiOS repository into the path 'CustomPiOS'.
        uses: actions/checkout@v4
        with:
          repository: 'guysoft/CustomPiOS'
          path: CustomPiOS

      - name: Clones the main project repository into the path 'repository' and loads all submodules.
        uses: actions/checkout@v4
        with:
          path: repository
          submodules: true

      - name: Updates paths in CustomPiOS based on the project repository.
        run: |
          cd repository/pibOS
          ../../CustomPiOS/src/update-custompios-paths

      - name: Downloads the Raspberry Pi OS image (Raspbian) as the base image.
        run: |
          cd repository/pibOS/image
          wget --continue --quiet --trust-server-names 'https://downloads.raspberrypi.com/raspios_arm64/images/raspios_arm64-2024-11-19/2024-11-19-raspios-bookworm-arm64.img.xz'

      - name: Builds the custom pibOS image.
        run: |
          sudo modprobe loop
          cd repository/pibOS
          sudo bash ./build_dist

      - name: Creates a compressed image of the built pibOS.
        id: get_arm64_info
        run: |
          source repository/pibOS/config
          IMAGE=pibOS-$(date +%y.%m.%d-%H.%M)
          sudo mv repository/pibOS/workspace/*.img ${IMAGE}.img
          pv --progress ${IMAGE}.img | sudo xz --extreme --threads=0 | sudo tee ${IMAGE}.img.xz >/dev/null
          echo "image=${IMAGE}.img.xz" >> $GITHUB_OUTPUT

      - name: Uploads the created pibOS image as an artifact.
        uses: actions/upload-artifact@v4
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          path: ${{ steps.get_arm64_info.outputs.image }}
          name: ${{ steps.get_arm64_info.outputs.image }}

      - name: Get current date
        id: date
        run: echo "date=$(date +'%y.%m.%d-%H.%M')" >> $GITHUB_OUTPUT

      - name: Create Weekly Release
        if: github.event.schedule == '0 0 * * 0'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: weekly-${{ steps.date.outputs.date }}
          name: Weekly Release ${{ steps.date.outputs.date }}
          draft: false
          prerelease: false
          body: |
            This is a weekly release from ${{ steps.date.outputs.date }}.
          files: ${{ steps.get_arm64_info.outputs.image }}

      - name: Create Daily Release
        if: github.event.schedule == '30 23 * * *'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: daily-${{ steps.date.outputs.date }}
          name: Daily Release ${{ steps.date.outputs.date }}
          draft: false
          prerelease: false
          body: |
            This is a daily release from ${{ steps.date.outputs.date }}.
          files: ${{ steps.get_arm64_info.outputs.image }}

      - name: Create Pre-Release
        if: contains(github.ref, 'release')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: pre-${{ github.ref_name }}-${{ steps.date.outputs.date }}
          name: Pre-Release ${{ github.ref_name }} from ${{ steps.date.outputs.date }}
          draft: false
          prerelease: true
          body: |
            This is a pre-release for ${{ github.ref_name }}.
          files: ${{ steps.get_arm64_info.outputs.image }}

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref }}
          draft: false
          prerelease: false
          body: |
            This is a release for ${{ github.ref }}.
          files: ${{ steps.get_arm64_info.outputs.image }}
